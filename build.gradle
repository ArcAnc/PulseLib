plugins {
    id 'base'
}

allprojects {
    group = mod_group_id
    version = mod_version
}

tasks.register('publishMods') {
    group = 'publishing'
    dependsOn ':neoforge:modrinth', ':fabric:modrinth', ':neoforge:publishCurseForge', ':fabric:publishCurseForge'
}

tasks.register('publishAll') {
    group = 'publishing'
    dependsOn ':neoforge:publish', ':fabric:publish', 'publishMods'
}
