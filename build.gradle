plugins {
    id 'base'
}

// Canonical testmod launch flags are configured by the multiloader-testmod convention.

allprojects {
    group = mod_group_id
    version = mod_version
}

tasks.register('publishMods') {
    group = 'publishing'
    dependsOn ':fabric:modrinth', ':fabric:publishCurseForge',
            ':neoforge:modrinth', ':neoforge:publishCurseForge'
}

tasks.register('publishAll') {
    group = 'publishing'
    dependsOn ':fabric:publish', ':neoforge:publish', 'publishMods'
}
