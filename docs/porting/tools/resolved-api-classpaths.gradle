 * Export each project's own resolved compile classpath; Gradle 9 requires its lock.
 */
gradle.projectsEvaluated {
	rootProject.subprojects.findAll { it.name in ['common', 'fabric', 'neoforge'] }.each { p ->
		p.tasks.register('resolvedApiClasspath') {
			if (p.tasks.findByName('createMinecraftArtifacts') != null)
				dependsOn p.tasks.named('createMinecraftArtifacts')
			doLast {
				def output = p.configurations.compileClasspath.files.collect { it.absolutePath }
				def destination = new File(p.layout.buildDirectory.get().asFile, 'resolved-api-classpath.json')
				destination.parentFile.mkdirs()
				destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(output)) + '\n'
			}
		}
	}
}
