import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('stage11Evidence') {
        dependsOn ':common:compileJava', ':neoforge:jar', ':fabric:jar'
        doLast {
            def common = root.project(':common')
            def artifacts = common.configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                [id: it.moduleVersion.id.toString(), file: it.file.absolutePath]
            }
            def forbidden = artifacts.findAll { artifact ->
                artifact.id.startsWith('net.neoforged:neoforge:') ||
                    artifact.id.startsWith('net.neoforged.fancymodloader:') ||
                    artifact.id.startsWith('net.fabricmc:fabric-loader:') ||
                    artifact.id.startsWith('net.fabricmc.fabric-api:')
            }
            assert forbidden.isEmpty(): "Loader artifacts in Common: ${forbidden}"
            def modules = ['common', 'neoforge', 'fabric'].collectEntries { module ->
                def target = root.project(":${module}")
                [(module): [
                    javaSources: target.tasks.named('compileJava').get().source.files.collect { root.relativePath(it) }.sort(),
                    classpath: target.configurations.compileClasspath.files.collect { it.absolutePath }.sort(),
                    jar: target.tasks.named('jar').get().archiveFile.get().asFile.absolutePath
                ]]
            }
            def report = root.file('build/reports/porting/stage-1.1-build.json')
            report.parentFile.mkdirs()
            report.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                gradle: gradle.gradleVersion, java: System.getProperty('java.version'),
                commonArtifacts: artifacts.sort { it.id }, modules: modules
            ])) + '\n'
            println "STAGE 1.1 CLASSPATH PASS: ${report}"
        }
    }
}
