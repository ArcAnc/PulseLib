import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Invoke with --init-script; does not alter the production build or compile project sources.
gradle.projectsEvaluated
{
	gradle.rootProject.subprojects.each
	{
		module ->
		module.tasks.register('resolvePortingDependencies')
		{
			group = 'verification'
			description = 'Strictly resolves external compile and runtime artifacts of this module.'
			doLast
			{
				['compileClasspath', 'runtimeClasspath'].each
				{ name ->
					def configuration = module.configurations.getByName(name)
					def artifacts = configuration.incoming.artifactView
					{
						componentFilter { it instanceof ModuleComponentIdentifier }
					}.artifacts.artifacts
					artifacts.sort { it.id.componentIdentifier.displayName }.each
					{ artifact ->
						if (!artifact.file.isFile())
							throw new GradleException("Missing artifact: ${artifact.id}")
						println "${module.path}:${name} ${artifact.id.componentIdentifier.displayName} ${artifact.file.name}"
					}
					println "RESOLVED ${module.path}:${name}: ${artifacts.size()} external artifacts"
				}
			}
		}
	}
	gradle.rootProject.tasks.register('resolvePortingDependencies')
	{
		dependsOn gradle.rootProject.subprojects.collect { "${it.path}:resolvePortingDependencies" }
	}
	gradle.rootProject.tasks.register('describePortingRuns')
	{
		group = 'verification'
		description = 'Prints the IntelliJ run model; invoke with -Didea.active=true -Didea.sync.active=true.'
		doLast
		{
			def model = project.extensions.getByName('idea')
			def settings = model.project.extensions.getByName('settings')
			settings.extensions.getByName('runConfigurations').each
			{ run ->
				println 'PORTING IDE RUN ' + groovy.json.JsonOutput.toJson(run.toMap())
			}
		}
	}
}
