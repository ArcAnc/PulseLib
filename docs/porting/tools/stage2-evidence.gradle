import groovy.json.JsonOutput
import java.util.zip.ZipFile

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.findProject(':common') == null) return
    root.tasks.register('stage2Evidence') {
        dependsOn ':common:test', ':fabric:test', ':common:jar', ':neoforge:jar', ':fabric:jar'
        doLast {
            def common = root.project(':common')
            def artifacts = common.configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                it.moduleVersion.id.toString()
            }.sort()
            assert artifacts.every {
                !it.startsWith('net.neoforged:neoforge:') && !it.startsWith('net.neoforged.fancymodloader:') &&
                    !it.startsWith('net.fabricmc:fabric-loader:') && !it.startsWith('net.fabricmc.fabric-api:')
            }: "Loader dependency in Common: ${artifacts}"
            assert common.fileTree('src/main/java').matching { include '**/*.java' }.every {
                !(it.text =~ /\bnet\.(neoforged|fabricmc)\./) && !it.text.contains('PulseLibEvents')
            }
            assert !root.file('neoforge/src/main/java/com/arcanc/pulselib/content/event/PulseLibEvents.java').exists()
            assert !common.file('src/main/java/com/arcanc/pulselib/util/PResourceCache.java').text.contains('setResourceRegistrar')
            def services = ['platform.IPulsePlatform', 'platform.IPulseCameraService', 'plugin.IPulsePluginFinder']
            def fixtureClasses = root.fileTree('tests/stage1/neoforge/java').matching {
                include '**/*.java'; exclude '**/package-info.java'
            }.collect { source ->
                root.file('tests/stage1/neoforge/java').toPath().relativize(source.toPath()).toString().replace('.java', '.class')
            }
            def modules = ['common', 'neoforge', 'fabric'].collectEntries { module ->
                def project = root.project(":${module}")
                def jar = project.tasks.named('jar').get().archiveFile.get().asFile
                def providers = [:]
                new ZipFile(jar).withCloseable { zip ->
                    def entries = zip.entries().collect { it.name }
                    assert entries.size() == entries.toSet().size(): "Duplicate JAR entry in ${module}"
                    assert entries.every { !it.contains('/PulseLibEvents') }: "Stale legacy registration in ${module}"
                    assert fixtureClasses.every { !entries.contains(it) }: "Test fixture leaked into ${module}"
                    services.each { service ->
                        def name = "META-INF/services/com.arcanc.pulselib.${service}".toString()
                        def entry = zip.getEntry(name)
                        if (module == 'common') {
                            assert entry == null: 'Common must not ship loader service providers'
                        } else {
                            assert entry != null: "Missing ${name} in ${module}"
                            def names = zip.getInputStream(entry).text.readLines().findAll { !it.isBlank() && !it.startsWith('#') }
                            assert names.size() == 1: "Expected one ${service} provider in ${module}"
                            assert names.first().startsWith("com.arcanc.pulselib.${module}.")
                            assert entries.contains(names.first().replace('.', '/') + '.class')
                            providers[service] = names.first()
                        }
                    }
                    ['PGlMultiDrawExecutor', 'PGlGeometryArena', 'PGlFrameArena', 'PGlInstanceStream',
                     'PGlIndirectStream', 'PGlWeightedBlendedOit'].each {
                        assert entries.contains("com/arcanc/pulselib/content/renderer/gl/${it}.class".toString())
                    }
                }
                [(module): [jar: root.relativePath(jar), providers: providers,
                            javaUnits: project.tasks.named('compileJava').get().source.files.size()]]
            }
            def report = root.file('build/reports/porting/stage-2-build.json')
            report.parentFile.mkdirs()
            report.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                java: System.getProperty('java.version'), gradle: gradle.gradleVersion,
                commonArtifacts: artifacts, modules: modules
            ])) + '\n'
            println "STAGE 2 SERVICE PROVIDERS / LEGACY REMOVAL / COMMON BOUNDARY PASS: ${report}"
        }
    }
}
