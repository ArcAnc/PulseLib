import org.gradle.api.artifacts.component.ProjectComponentIdentifier

// Requires --init-script tests/porting/core-check.gradle first. No production tasks are altered.
gradle.projectsEvaluated
{
	def common = gradle.rootProject.findProject(':common')
	if (common == null)
		return
	def fabric = gradle.rootProject.project(':fabric')
	def fixture = gradle.rootProject.file('tests/porting')
	def integration = common.layout.buildDirectory.dir('porting-core/integration')
	def external = fabric.configurations.compileClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	def runtime = fabric.configurations.runtimeClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	def output = fabric.layout.buildDirectory.dir('porting-core/native-classes')
	def compile = fabric.tasks.register('compilePortingNativeFixture', JavaCompile)
	{
		dependsOn common.tasks.named('compilePortingIntegrationChecks')
		source new File(fixture, 'src/fabric/java')
		source common.file('src/main/java/com/arcanc/pulselib/content/mixin/ItemStackMixin.java')
		source fabric.file('src/main/java/com/arcanc/pulselib/fabric/FabricPlatform.java'),
				fabric.file('src/main/java/com/arcanc/pulselib/fabric/FabricPulsePluginFinder.java'),
				fabric.file('src/main/java/com/arcanc/pulselib/fabric/PulseLibFabric.java')
		classpath = fabric.files(integration, external)
		javaCompiler = fabric.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
		options.encoding = 'UTF-8'
		options.compilerArgs.add('-proc:none')
		options.sourcepath = fabric.files()
		destinationDirectory = output
	}
	def fixtureJar = fabric.tasks.register('portingNativeFixtureJar', Jar)
	{
		dependsOn compile
		archiveFileName = 'pulselib-stage2-native-fixture.jar'
		destinationDirectory = fabric.layout.buildDirectory.dir('porting-core')
		from(integration) { exclude 'com/arcanc/pulselib/porting/**' }
		from output
		from new File(fixture, 'src/fabric/resources')
		from(fabric.file('src/main/resources')) { include 'META-INF/services/**' }
	}
	fabric.tasks.register('checkPortingNativeItemStack', JavaExec)
	{
		group = 'verification'
		description = 'Runs a separate Fabric fixture with the real ItemStack Mixin; stops before world startup.'
		dependsOn fixtureJar
		classpath = fabric.files(fixtureJar.flatMap { it.archiveFile }, runtime)
		mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotServer'
		jvmArgs '-Dfabric.development=true', '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
		args '--nogui'
		maxHeapSize = '1G'
		timeout = java.time.Duration.ofMinutes(2)
		doFirst
		{
			def parent = fabric.layout.buildDirectory.dir('porting-core').get().asFile.toPath()
			workingDir = java.nio.file.Files.createTempDirectory(parent, 'native-run-').toFile()
			logger.lifecycle('Isolated native fixture directory: {}', workingDir)
		}
		doLast
		{
			def log = new File(workingDir, 'logs/latest.log')
			if (!log.isFile() || !log.text.contains('PULSELIB_NATIVE_FIXTURE_PASSED'))
				throw new GradleException('Native fixture ended without its success marker')
			if (!fabric.fileTree(workingDir) { include '**/level.dat', '**/session.lock' }.isEmpty())
				throw new GradleException('Native fixture unexpectedly created world state')
		}
	}
}
