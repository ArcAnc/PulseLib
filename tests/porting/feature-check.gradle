import org.gradle.api.artifacts.component.ProjectComponentIdentifier

// Requires rhi-check.gradle. Tests actual submit/preparation hooks with a controlled CPU vertex sink.
gradle.projectsEvaluated
{
	def root = gradle.rootProject
	def common = root.findProject(':common')
	if (common == null)
		return
	def neo = root.project(':neoforge')
	def shared = common.layout.buildDirectory.dir('porting-rhi/classes')
	def output = common.layout.buildDirectory.dir('porting-feature/classes')
	def names = [
		'content/mixin/ItemSubmitMixin', 'content/mixin/ItemFeatureRendererMixin', 'content/mixin/WeatherEffectRendererMixin',
		'content/mixin/ModelPartSubmitMixin', 'content/mixin/ModelPartFeatureRendererMixin',
		'content/mixin/PlayerModelSubmitMixin', 'content/mixin/PlayerModelFeatureMixin',
		'content/mixin/ArmorProviderSubmitMixin', 'content/mixin/ArmorProviderFeatureMixin',
		'content/mixin/PoseStackAccessor', 'content/mixin/ModelPartCubesMixin',
		'content/mixin/PlayerGeometryRenderStateMixin', 'content/mixin/ArmorProviderStateMixin', 'content/mixin/PlayerRigRenderStateMixin',
		'content/renderer/base/PModelPartSnapshot', 'content/renderer/base/PModelPartSubmitState', 'content/renderer/base/PPlayerRigRenderState',
		'content/player/deformer/PPlayerDeformerSnapshot', 'content/player/deformer/PDeformedCuboid',
		'content/player/deformer/PPlayerVertexDeformer', 'content/player/deformer/PModelPartCubes',
		'content/player/deformer/PPlayerModelGeometry', 'content/player/deformer/PPlayerModelSubmitState', 'content/player/deformer/PPlayerGeometryRenderState',
		'content/player/animation/PPlayerRigPose',
		'util/attachments/humanoid/armor/PArmorModelSnapshots'
	]
	def external = neo.configurations.compileClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	def compile = common.tasks.register('compilePortingFeatureChecks', Exec)
	{
		dependsOn common.tasks.named('compilePortingRhiChecks')
		def selected = common.files(names.collect { common.file('src/main/java/com/arcanc/pulselib/' + it + '.java') },
				root.fileTree('tests/porting/src/feature/java') { include '**/*.java' })
		inputs.files(common.fileTree('src/main/java'), selected, shared, external)
		outputs.dir(output)
		doFirst
		{
			def destination = output.get().asFile
			common.delete(destination)
			destination.mkdirs()
			def compiler = common.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }.get()
			def arguments = ['--release', '25', '-encoding', 'UTF-8', '-proc:none', '-implicit:none',
					'-classpath', common.files(shared, common.configurations.compileClasspath, external).asPath,
					'-sourcepath', common.file('src/main/java').absolutePath, '-d', destination.absolutePath]
			arguments.addAll(selected.files.collect { it.absolutePath }.sort())
			def argfile = new File(destination.parentFile, 'feature-javac.args')
			argfile.text = arguments.collect { '"' + it.replace('\\', '\\\\').replace('"', '\\"') + '"' }.join('\n') + '\n'
			commandLine compiler.executablePath.asFile.absolutePath, '@' + argfile.absolutePath
		}
	}
	def jar = neo.tasks.register('portingFeatureFixtureJar', Jar)
	{
		dependsOn compile
		archiveFileName = 'pulselib-feature-fixture.jar'
		destinationDirectory = neo.layout.buildDirectory.dir('porting-feature')
		from output
		from shared
		from root.file('tests/porting/src/feature/resources')
	}
	def runtime = neo.configurations.runtimeClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	neo.tasks.register('checkPortingFeatures', JavaExec)
	{
		dependsOn jar, neo.tasks.named('createMinecraftArtifacts')
		group = 'verification'
		classpath = neo.files(jar.flatMap { it.archiveFile }, runtime)
		mainClass = 'com.arcanc.pulselib.content.player.deformer.FeatureFixtureLauncher'
		jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow',
				'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED', '--add-exports=jdk.naming.dns/com.sun.jndi.dns=java.naming'
		timeout = java.time.Duration.ofMinutes(2)
		doFirst
		{
			def parent = neo.layout.buildDirectory.dir('porting-feature').get().asFile
			parent.mkdirs()
			workingDir = java.nio.file.Files.createTempDirectory(parent.toPath(), 'client-').toFile()
		}
	}
}
