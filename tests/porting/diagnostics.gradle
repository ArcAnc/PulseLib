import groovy.json.JsonOutput

allprojects
{ module ->
	if (module.path in [':common', ':fabric', ':neoforge'])
		module.tasks.register('exportPortingCompilation')
		{
			doLast
			{
				def compilation = module.tasks.named('compileJava', JavaCompile).get()
				def data = [sources: compilation.source.files.collect { it.absolutePath }.sort(),
						classpath: compilation.classpath.files.collect { it.absolutePath }]
				def directory = new File(module.property('portingDiagnosticsDir').toString())
				directory.mkdirs()
				new File(directory, module.name + '-inputs.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(data))
			}
		}
}
