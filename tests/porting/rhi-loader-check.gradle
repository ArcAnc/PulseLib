import org.gradle.api.artifacts.component.ProjectComponentIdentifier

// Requires rhi-check.gradle first; leaves production tasks and source sets unchanged.
gradle.projectsEvaluated
{
	def root = gradle.rootProject
	def common = root.findProject(':common')
	if (common == null)
		return
	def fabric = root.project(':fabric')
	def shared = common.layout.buildDirectory.dir('porting-rhi/classes')
	def output = fabric.layout.buildDirectory.dir('porting-rhi-registration/classes')
	def external = fabric.configurations.compileClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	def runtime = fabric.configurations.runtimeClasspath.incoming.artifactView
	{
		componentFilter { !(it instanceof ProjectComponentIdentifier) }
	}.files
	def compile = fabric.tasks.register('compilePortingRhiRegistration', JavaCompile)
	{
		dependsOn common.tasks.named('compilePortingRhiChecks')
		source root.file('tests/porting/src/rhi-fabric/java')
		source fabric.file('src/main/java/com/arcanc/pulselib/fabric/FabricRhiPipelines.java')
		classpath = fabric.files(shared, external)
		javaCompiler = fabric.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
		options.compilerArgs.add('-proc:none')
		options.sourcepath = fabric.files()
		destinationDirectory = output
	}
	def jar = fabric.tasks.register('portingRhiRegistrationFixtureJar', Jar)
	{
		dependsOn compile
		archiveFileName = 'pulselib-rhi-registration-fixture.jar'
		destinationDirectory = fabric.layout.buildDirectory.dir('porting-rhi-registration')
		from(shared)
		{
			include 'com/arcanc/pulselib/content/renderer/rhi/PRhiPipelines*.class'
			include 'com/arcanc/pulselib/content/renderer/rhi/RhiCatalogChecks.class'
			include 'com/arcanc/pulselib/content/model/textures/PAlphaMode.class'
			include 'com/arcanc/pulselib/util/PRenderTypes*.class'
			include 'com/arcanc/pulselib/util/PLibDatabase.class'
			include 'com/arcanc/pulselib/content/renderer/rhi/package-info.class'
			include 'com/arcanc/pulselib/content/renderer/rhi/FieldsAreNonnullByDefault.class'
			include 'com/arcanc/pulselib/content/renderer/rhi/MethodsReturnNonnullByDefault.class'
		}
		from output
		from root.file('tests/porting/src/rhi-fabric/resources')
		from(fabric.file('src/main/resources')) { include 'pulselib.accesswidener' }
	}
	fabric.tasks.register('checkPortingRhiRegistration', JavaExec)
	{
		dependsOn jar
		group = 'verification'
		classpath = fabric.files(jar.flatMap { it.archiveFile }, runtime)
		mainClass = 'com.arcanc.pulselib.content.renderer.rhi.FabricPipelineLauncher'
		jvmArgs '-Dfabric.development=true', '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
		timeout = java.time.Duration.ofMinutes(2)
		ignoreExitValue = true
		def captured = new ByteArrayOutputStream()
		standardOutput = captured
		errorOutput = captured
		doFirst
		{
			def parent = fabric.layout.buildDirectory.dir('porting-rhi-registration').get().asFile
			parent.mkdirs()
			workingDir = java.nio.file.Files.createTempDirectory(parent.toPath(), 'client-').toFile()
		}
		doLast
		{
			def text = captured.toString('UTF-8')
			new File(workingDir, 'registration.log').text = text
			logger.lifecycle(text)
			if (executionResult.get().exitValue != 0 || !text.contains('PULSELIB_FABRIC_RHI_REGISTRATION_PASSED'))
				throw new GradleException('Fabric RHI registration fixture failed; see ' + workingDir)
			if (!fabric.fileTree(workingDir) { include '**/level.dat', '**/session.lock' }.isEmpty())
				throw new GradleException('Registration fixture unexpectedly created world state')
		}
	}
}
