import org.gradle.api.artifacts.component.ProjectComponentIdentifier

// Explicit component checks, not an alternative production source set or a distributable mod.
gradle.projectsEvaluated
{
	def common = gradle.rootProject.findProject(':common')
	if (common == null)
		return
	def fixture = gradle.rootProject.file('tests/porting')
	def base = common.file('src/main/java/com/arcanc/pulselib')
	def names = [
		'api/plugin/PulsePlugin',
		'api/registration/PulseRegistrar',
		'plugin/IPulsePluginFinder', 'plugin/PulsePluginCandidate',
		'plugin/PulsePluginClassScanner', 'plugin/PulsePluginLifecycle',
		'platform/IPulsePlatform', 'platform/PulseServices',
		'util/PLibDatabase', 'util/helpers/PLibCodecs',
		'content/registration/PRegistry',
		'content/animatable/PItemStackAnimationData', 'content/animatable/PItemStackAnimationIds',
		'content/animatable/PItemStackAnimationIdentity',
		'data/gecko/MolangParser', 'data/gecko/PExpressionDependency', 'data/gecko/PExpressionEvaluator',
		'content/model/animation/PInterpolation', 'content/model/animation/PInterpolationType',
		'content/model/animation/PPoseEasing', 'content/model/animation/PVectorConversion',
		'content/model/textures/PAlphaMode',
		'content/renderer/plan/PGeometryData', 'content/renderer/plan/PDrawCommand',
		'content/renderer/plan/PInstanceHeader', 'content/renderer/plan/PMeshHandle',
		'content/renderer/plan/PPipelineHandle'
	]
	def sources = names.collect { new File(base, it + '.java') }
	def packageInfo = sources.collect { new File(it.parentFile, 'package-info.java') }.findAll { it.isFile() }.unique()
	def output = common.layout.buildDirectory.dir('porting-core/classes')
	def runtime = common.configurations.create('portingCoreCheckRuntime')
	{
		canBeConsumed = false
		canBeResolved = true
		extendsFrom common.configurations.runtimeClasspath
	}
	// Both actual 26.2 loaders provide ASM 9.10.1; Common alone has no loader runtime.
	common.dependencies.add(runtime.name, 'org.ow2.asm:asm:9.10.1')
	def compile = common.tasks.register('compilePortingCoreChecks', JavaCompile)
	{
		dependsOn common.tasks.named('createMinecraftArtifacts')
		source sources, packageInfo, new File(fixture, 'src/main/java')
		classpath = common.configurations.compileClasspath
		javaCompiler = common.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
		options.encoding = 'UTF-8'
		options.compilerArgs.add('-proc:none')
		options.sourcepath = common.files()
		destinationDirectory = output
	}
	common.tasks.register('checkPortingCore', JavaExec)
	{
		group = 'verification'
		description = 'Runs isolated 26.2 core component checks; does not replace or relax compileJava.'
		dependsOn compile
		classpath = common.files(output, new File(fixture, 'src/main/resources'), runtime)
		mainClass = 'com.arcanc.pulselib.porting.CoreCheckLauncher'
		workingDir = common.layout.buildDirectory.dir('porting-core/run').get().asFile
		maxHeapSize = '1G'
		doFirst { workingDir.mkdirs() }
	}
	['fabric': 'Fabric', 'neoforge': 'NeoForge'].each
	{ name, prefix ->
		def module = gradle.rootProject.project(':' + name)
		def external = module.configurations.compileClasspath.incoming.artifactView
		{
			componentFilter { !(it instanceof ProjectComponentIdentifier) }
		}.files
		def adapterOutput = module.layout.buildDirectory.dir('porting-core/adapters')
		def adapters = module.tasks.register('compilePortingDiscovery', JavaCompile)
		{
			dependsOn compile
			source module.file("src/main/java/com/arcanc/pulselib/${name}/${prefix}Platform.java"),
					module.file("src/main/java/com/arcanc/pulselib/${name}/${prefix}PulsePluginFinder.java")
			classpath = module.files(output, external)
			javaCompiler = module.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
			options.release = 25
			options.encoding = 'UTF-8'
			options.compilerArgs.add('-proc:none')
			options.sourcepath = module.files()
			destinationDirectory = adapterOutput
		}
		module.tasks.register('checkPortingDiscovery', JavaExec)
		{
			group = 'verification'
			description = 'Verifies real platform/discovery adapter ABI and classloading, not complete loader bootstrap.'
			dependsOn adapters
			classpath = module.files(output, adapterOutput, external)
			mainClass = 'com.arcanc.pulselib.porting.CoreCheckLauncher'
			args 'discovery', "com.arcanc.pulselib.${name}.${prefix}Platform",
					"com.arcanc.pulselib.${name}.${prefix}PulsePluginFinder"
			workingDir = module.layout.buildDirectory.dir('porting-core/run').get().asFile
			doFirst { workingDir.mkdirs() }
		}
	}
}
