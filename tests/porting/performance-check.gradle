gradle.projectsEvaluated
{
	def root = gradle.rootProject
	def fabric = root.findProject(':fabric')
	if (fabric == null)
		return
	def fixtures = root.file(root.providers.gradleProperty('portingBenchFixtures').getOrElse('tests/porting/bench'))
	def reference = root.property('minecraft_version') == '26.1.2'
	def variant = reference ? 'reference' : 'current'
	def compile = fabric.tasks.register('compilePortingBenchmark', JavaCompile)
	{
		dependsOn fabric.tasks.named('classes')
		source new File(fixtures, 'shared'), new File(fixtures, variant)
		classpath = fabric.sourceSets.main.output + fabric.configurations.compileClasspath
		javaCompiler = fabric.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
		options.compilerArgs.add('-proc:none')
		destinationDirectory = fabric.layout.buildDirectory.dir('porting-performance/classes')
	}
	def jar = fabric.tasks.register('portingBenchmarkJar', Jar)
	{
		dependsOn compile
		archiveFileName = 'pulselib-benchmark.jar'
		destinationDirectory = fabric.layout.buildDirectory.dir('porting-performance')
		from compile.flatMap { it.destinationDirectory }
		from new File(fixtures, 'resources')
	}
	def parent = fabric.layout.buildDirectory.dir('porting-performance').get().asFile
	parent.mkdirs()
	def directory = java.nio.file.Files.createTempDirectory(parent.toPath(), 'client-').toFile()
	if (reference)
		fabric.loom.runs.client.runDir(fabric.projectDir.toPath().relativize(directory.toPath()).toString())
	else
	{
		fabric.loom.runs.client.runDirectory.set(fabric.layout.dir(fabric.provider { directory }))
		fabric.loom.runs.client.programArgs('--graphicsBackend', 'OPENGL')
	}
	fabric.tasks.named('runClient')
	{
		dependsOn jar
		timeout = java.time.Duration.ofMinutes(4)
		doFirst
		{
			fabric.copy
			{
				from jar.flatMap { it.archiveFile }
				into new File(directory, 'mods')
			}
			logger.lifecycle('PulseLib benchmark: ' + directory)
		}
		doLast
		{
			def result = new File(directory, 'pulselib-benchmark.csv')
			if (!result.isFile() || result.readLines().size() != 361)
				throw new GradleException('Benchmark did not produce all synchronized samples')
		}
	}
}
