// Opt-in full production client. No fixture mod, source exclusions or relaxed Mixin requirements.
gradle.afterProject
{ project ->
	if (project.path != ':fabric')
		return
	project.afterEvaluate
	{
		def backend = project.providers.gradleProperty('portingClientBackend').getOrElse('opengl').toLowerCase(Locale.ROOT)
		if (!(backend in ['opengl', 'vulkan']))
			throw new GradleException('portingClientBackend must be opengl or vulkan')
		def parent = project.layout.buildDirectory.dir('porting-client').get().asFile
		parent.mkdirs()
		def directory = java.nio.file.Files.createTempDirectory(parent.toPath(), 'fabric-' + backend + '-').toFile()
		project.loom.runs.client.runDirectory.set(project.layout.dir(project.provider { directory }))
		project.loom.runs.client.programArgs('--graphicsBackend', backend.toUpperCase(Locale.ROOT))
		project.tasks.named('runClient')
		{
			timeout = java.time.Duration.ofMinutes(3)
			doFirst
			{
				logger.lifecycle('PulseLib isolated production client: ' + directory + '; requested backend: ' + backend)
			}
		}
	}
}
