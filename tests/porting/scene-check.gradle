// Actual game + production PulseLib, with a separate client-only test mod in a fresh mods directory.
gradle.projectsEvaluated
{
	def root = gradle.rootProject
	def common = root.findProject(':common')
	if (common == null)
		return
	def compile = common.tasks.register('compilePortingScene', JavaCompile)
	{
		dependsOn common.tasks.named('classes')
		source root.fileTree('tests/porting/src/scene/java') { include '**/*.java' }
		classpath = common.sourceSets.main.output + common.configurations.compileClasspath
		javaCompiler = common.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
		options.compilerArgs.add('-proc:none')
		destinationDirectory = common.layout.buildDirectory.dir('porting-scene/classes')
	}
	def jar = common.tasks.register('portingSceneJar', Jar)
	{
		dependsOn compile
		archiveFileName = 'pulselib-client-scene.jar'
		destinationDirectory = common.layout.buildDirectory.dir('porting-scene')
		from compile.flatMap { it.destinationDirectory }
		from root.file('tests/porting/src/scene/resources')
	}
	def loader = root.providers.gradleProperty('portingSceneLoader').getOrElse('fabric')
	if (!(loader in ['fabric', 'neoforge']))
		throw new GradleException('portingSceneLoader must be fabric or neoforge')
	def backend = root.providers.gradleProperty('portingSceneBackend').getOrElse('opengl')
	if (!(backend in ['opengl', 'vulkan']))
		throw new GradleException('portingSceneBackend must be opengl or vulkan')
	def oit = root.providers.gradleProperty('portingSceneOit').getOrElse('false')
	def gui = root.providers.gradleProperty('portingSceneGui').getOrElse('false')
	def queue = root.providers.gradleProperty('portingSceneQueue').getOrElse('false')
	def shaders = root.providers.gradleProperty('portingSceneShaders').getOrElse('false')
	def earlyWindow = root.providers.gradleProperty('portingSceneEarlyWindow').getOrElse('true')
	if (!(earlyWindow in ['true', 'false']))
		throw new GradleException('portingSceneEarlyWindow must be true or false')
	def project = root.project(':' + loader)
	def parent = project.layout.buildDirectory.dir('porting-scene').get().asFile
	parent.mkdirs()
	def directory = java.nio.file.Files.createTempDirectory(parent.toPath(), 'client-').toFile()
	if (loader == 'fabric')
	{
		project.loom.runs.client.runDirectory.set(project.layout.dir(project.provider { directory }))
		project.loom.runs.client.programArgs('--graphicsBackend', backend.toUpperCase())
		project.loom.runs.client.vmArg('-Dpulselib.scene.backend=' + backend)
		project.loom.runs.client.vmArg('-Dpulselib.scene.shaders=' + shaders)
		project.loom.runs.client.vmArg('-Dpulselib.scene.queue=' + queue)
		project.loom.runs.client.vmArg('-Dpulselib.scene.gui=' + gui)
		project.loom.runs.client.vmArg('-Dpulselib.scene.oit=' + oit)
	}
	else
		project.neoForge.runs.named('client')
		{
			gameDirectory = directory
			programArguments.addAll('--graphicsBackend', backend.toUpperCase())
			jvmArguments.add('-Dpulselib.scene.backend=' + backend)
			jvmArguments.add('-Dpulselib.scene.shaders=' + shaders)
			jvmArguments.add('-Dpulselib.scene.queue=' + queue)
			jvmArguments.add('-Dpulselib.scene.gui=' + gui)
			jvmArguments.add('-Dpulselib.scene.oit=' + oit)
		}
	project.tasks.named('runClient')
	{
		dependsOn jar
		timeout = java.time.Duration.ofMinutes(2)
		doFirst
		{
			if (loader == 'neoforge' && earlyWindow == 'false')
			{
				def config = new File(directory, 'config/fml.toml')
				config.parentFile.mkdirs()
				config.text = 'earlyWindowControl = false\n'
				logger.lifecycle('Scene-only FML earlyWindowControl=false; Vulkan still required by backend guard')
			}
			project.copy
			{
				from jar.flatMap { it.archiveFile }
				into new File(directory, 'mods')
			}
			logger.lifecycle('PulseLib production scene: ' + directory)
		}
		doLast
		{
			def result = new File(directory, 'pulselib-scene-result.txt')
			if (!result.isFile() || result.text.trim() != 'PASS')
				throw new GradleException('Production scene did not pass: ' + (result.isFile() ? result.text : 'no result'))
		}
	}
}
