plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'multiloader-publishing'
}

neoForge {
    version = neo_version
    accessTransformers.from rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (PulseLib)"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        pulselib { sourceSet sourceSets.main }
    }
}

dependencies {
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        jarJar it
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

tasks.named('processResources') {
    from(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')) { into 'META-INF' }
}

// The original 26.1 demos are verification fixtures, never release content.
if (providers.gradleProperty('pulseStage1Smoke').isPresent()) {
    sourceSets {
        stage1Smoke {
            java.srcDir rootProject.file('tests/stage1/neoforge/java')
            resources.srcDir rootProject.file('tests/stage1/neoforge/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge {
        mods { pulselib_stage1 { sourceSet sourceSets.stage1Smoke } }
        runs {
            configureEach {
                gameDirectory = layout.buildDirectory.dir("${providers.gradleProperty('pulseVerificationDir').getOrElse('stage1-runs')}/${it.name}").get().asFile
                if (providers.gradleProperty('pulseRespawnProbe').isPresent())
                    systemProperty 'pulselib.respawnProbe', 'true'
                if (providers.gradleProperty('pulseServerMotionProbe').isPresent()) {
                    systemProperty 'pulselib.serverMotionProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseAnimatedEffectsProbe').isPresent()) {
                    systemProperty 'pulselib.animatedEffectsProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseAnimatedEnvironmentProbe').isPresent()) {
                    systemProperty 'pulselib.animatedEnvironmentProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseFirstPersonArmorProbe').isPresent())
                    systemProperty 'pulselib.firstPersonArmorProbe', 'true'
                if (providers.gradleProperty('pulseStage52b4cProbe').isPresent())
                    systemProperty 'pulselib.stage52b4cProbe', 'true'
                if (providers.gradleProperty('pulseStage52b4bProbe').isPresent())
                    systemProperty 'pulselib.stage52b4bProbe', 'true'
                if (providers.gradleProperty('pulseStage52b4aProbe').isPresent())
                    systemProperty 'pulselib.stage52b4aProbe', 'true'
                if (providers.gradleProperty('pulsePlayerOcclusionProbe').isPresent() || providers.gradleProperty('pulseStage52b4aProbe').isPresent() || providers.gradleProperty('pulseStage52b4bProbe').isPresent() || providers.gradleProperty('pulseStage52b4cProbe').isPresent())
                    systemProperty 'pulselib.playerOcclusionProbe', 'true'
                if (providers.gradleProperty('pulseStage52b2bProbe').isPresent()) {
                    systemProperty 'pulselib.stage52b2bProbe', 'true'
                }
                if (providers.gradleProperty('pulseStage52b3Probe').isPresent())
                    systemProperty 'pulselib.stage52b3Probe', 'true'
                if (providers.gradleProperty('pulseStage52b2Probe').isPresent()) {
                    systemProperty 'pulselib.stage52b2Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage52bProbe').isPresent()) {
                    systemProperty 'pulselib.stage52bProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage52aProbe').isPresent()) {
                    systemProperty 'pulselib.stage52aProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage51Probe').isPresent()) {
                    systemProperty 'pulselib.stage51Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage43cGlintProbe').isPresent())
                    systemProperty 'pulselib.stage43cGlintProbe', 'true'
                if (providers.gradleProperty('pulseStage43cProbe').isPresent()) {
                    systemProperty 'pulselib.stage43cProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage43b2Probe').isPresent()) {
                    systemProperty 'pulselib.stage43b2Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage43bProbe').isPresent()) {
                    systemProperty 'pulselib.stage43bProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage43aProbe').isPresent()) {
                    systemProperty 'pulselib.stage43aProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage42cProbe').isPresent())
                {
                    systemProperty 'pulselib.stage42cProbe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage42b4Probe').isPresent())
                {
                    systemProperty 'pulselib.stage42b4Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage42b3Probe').isPresent())
                {
                    systemProperty 'pulselib.stage42b3Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
                if (providers.gradleProperty('pulseStage42b2Probe').isPresent()) {
                    systemProperty 'pulselib.stage42b2Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage42b1Probe').isPresent()) {
                    systemProperty 'pulselib.stage42b1Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage42aProbe').isPresent()) {
                    systemProperty 'pulselib.stage42aProbe', 'true'
                }
                if (providers.gradleProperty('pulseStage41b3Probe').isPresent()) {
                    systemProperty 'pulselib.stage41b3Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage41b2Probe').isPresent()) {
                    systemProperty 'pulselib.stage41b2Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage41bProbe').isPresent()) {
                    systemProperty 'pulselib.stage41bProbe', 'true'
                }
                if (providers.gradleProperty('pulseStage41Probe').isPresent()) {
                    systemProperty 'pulselib.stage41Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage33Probe').isPresent()) {
                    systemProperty 'pulselib.stage33Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage32Probe').isPresent()) {
                    systemProperty 'pulselib.stage32Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage31Probe').isPresent()) {
                    systemProperty 'pulselib.stage31Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage2Probe').isPresent()) {
                    systemProperty 'pulselib.stage2Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
            }
            client {
                if (providers.gradleProperty('pulseManualRun').isPresent())
                    systemProperty 'pulselib.manualRun', 'true'
                programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25576', '--width', '960', '--height', '640'
            }
        }
    }
    tasks.named('runServer') { standardInput = System.in }
    tasks.named('processStage1SmokeResources') {
        ['geckolib', 'glmodels', 'textures'].each { archive ->
            from(zipTree(rootProject.file("common/src/main/resources/assets/pulselib/${archive}.zip"))) {
                into 'assets/pulselib'
            }
        }
    }
}

// Canonical armor-provider fixture; shared suite and assets stay out of release artifacts.
if (providers.gradleProperty('pulseArmorProviderProbe').isPresent()) {
    sourceSets {
        stage62Armor {
            java.srcDirs rootProject.file('tests/stage62armor/common/java'), rootProject.file('tests/stage62armor/neoforge/java')
            resources.srcDirs rootProject.file('tests/stage62armor/common/resources'), rootProject.file('tests/stage62armor/neoforge/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge {
        mods { pulselib_stage62armor { sourceSet sourceSets.stage62Armor } }
        runs {
            configureEach {
                gameDirectory = layout.buildDirectory.dir("stage62d2a-runs/${it.name}").get().asFile
                jvmArgument '-Xlog:class+load=info:file=classloading.log'
            }
            client { programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25585', '--width', '960', '--height', '640' }
        }
    }
    tasks.named('runServer') { standardInput = System.in }
}
