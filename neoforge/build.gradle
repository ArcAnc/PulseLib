plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'multiloader-publishing'
}

neoForge {
    version = neo_version
    accessTransformers.from rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (PulseLib)"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        pulselib { sourceSet sourceSets.main }
    }
}

dependencies {
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        jarJar it
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

tasks.named('processResources') {
    from(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')) { into 'META-INF' }
}

// The original 26.1 demos are verification fixtures, never release content.
if (providers.gradleProperty('pulseStage1Smoke').isPresent()) {
    sourceSets {
        stage1Smoke {
            java.srcDir rootProject.file('tests/stage1/neoforge/java')
            resources.srcDir rootProject.file('tests/stage1/neoforge/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge {
        mods { pulselib_stage1 { sourceSet sourceSets.stage1Smoke } }
        runs {
            configureEach {
                gameDirectory = layout.buildDirectory.dir("${providers.gradleProperty('pulseVerificationDir').getOrElse('stage1-runs')}/${it.name}").get().asFile
                if (providers.gradleProperty('pulseStage33Probe').isPresent()) {
                    systemProperty 'pulselib.stage33Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage32Probe').isPresent()) {
                    systemProperty 'pulselib.stage32Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage31Probe').isPresent()) {
                    systemProperty 'pulselib.stage31Probe', 'true'
                }
                if (providers.gradleProperty('pulseStage2Probe').isPresent()) {
                    systemProperty 'pulselib.stage2Probe', 'true'
                    jvmArgument '-Xlog:class+load=info:file=classloading.log'
                }
            }
            client {
                programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25576', '--width', '960', '--height', '640'
            }
        }
    }
    tasks.named('runServer') { standardInput = System.in }
    tasks.named('processStage1SmokeResources') {
        ['geckolib', 'glmodels', 'textures'].each { archive ->
            from(zipTree(rootProject.file("common/src/main/resources/assets/pulselib/${archive}.zip"))) {
                into 'assets/pulselib'
            }
        }
    }
}
