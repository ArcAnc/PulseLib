plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'multiloader-publishing'
}

apply from: rootProject.file('testmod/source-set.gradle')

neoForge {
    version = neo_version
    accessTransformers.from rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
    mods {
        pulselib { sourceSet sourceSets.main }
        pulselib_test { sourceSet sourceSets.testmod }
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        testClient {
            client()
            sourceSet = sourceSets.testmod
            gameDirectory = project.file('runs/testmod')
        }
        configureEach {
            loadedMods.set(name == 'testClient' ? [mods.pulselib, mods.pulselib_test] : [mods.pulselib])
            ideName = "NeoForge ${it.name.capitalize()} (PulseLib ${minecraft_version})"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        jarJar it
    }
}

sourceSets.main.resources {
    srcDir 'src/main/templates'
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

tasks.named('processResources') {
    from(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')) { into 'META-INF' }
}
