import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardOpenOption

// Bootstrap remains independent of canonical demo content; full harness migration continues in 7.1b.2.
sourceSets {
    testmod {
        java.srcDirs rootProject.file('tests/testmod/bootstrap/common/java'), rootProject.file("tests/testmod/bootstrap/${project.name}/java")
        resources.srcDirs rootProject.file('tests/testmod/bootstrap/common/resources'), rootProject.file("tests/testmod/bootstrap/${project.name}/resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def testmodJar = tasks.register('testmodJar', Jar) {
    group = 'verification'
    description = 'Packages the isolated 26.1.2 external testmod bootstrap; not the full canonical demo.'
    dependsOn tasks.named('testmodClasses')
    from sourceSets.testmod.output
    from rootProject.file('LICENSE.txt')
    archiveBaseName = 'pulselib-testmod-bootstrap'
    archiveVersion = "${minecraft_version}-${mod_version}"
    archiveClassifier = project.name
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest.attributes 'PulseLib-Test-Stage': '7.1a', 'PulseLib-Canonical-Source': '7ce6f024b307bb821ce543344d3896c8e1fcf26b'
}

// Canonical demo content profile; complete regression harness flags remain guarded.
sourceSets {
    demo {
        java.srcDirs rootProject.file('tests/testmod/demo/common/java'), rootProject.file("tests/testmod/demo/${project.name}/java")
        resources.srcDirs rootProject.file('tests/testmod/demo/common/resources'), rootProject.file("tests/testmod/demo/${project.name}/resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def demoJar = tasks.register('demoJar', Jar) {
    group = 'verification'
    description = 'Packages canonical demo content; full regression harnesses remain stage 7.1b.2.'
    from sourceSets.demo.output
    from rootProject.file('LICENSE.txt')
    archiveBaseName = 'pulselib-testmod-demo'
    archiveVersion = "${minecraft_version}-${mod_version}"
    archiveClassifier = project.name
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest.attributes 'PulseLib-Test-Stage': '7.1b.1', 'PulseLib-Canonical-Source': '7ce6f024b307bb821ce543344d3896c8e1fcf26b'
}
def demoSource = providers.gradleProperty('pulseDemoContent').isPresent()
def demoPackaged = providers.gradleProperty('pulseDemoJar').isPresent()
def demoMode = demoSource || demoPackaged
def animationRegression = providers.gradleProperty('pulseAnimationRegression').isPresent()
def skipAnimationRemoval = providers.gradleProperty('pulseAnimationSkipRemoval').isPresent()
def lifecycleRegression = providers.gradleProperty('pulseLifecycleRegression').isPresent()
def skipDisconnectHook = providers.gradleProperty('pulseLifecycleSkipHook').isPresent()
if ((lifecycleRegression && !demoMode) || (skipDisconnectHook && !lifecycleRegression))
    throw new GradleException('Lifecycle regression requires a demo source/JAR profile; skip-hook is an explicit negative control requiring lifecycle regression.')
if ((animationRegression && !demoMode) || (skipAnimationRemoval && !animationRegression))
    throw new GradleException('Animation regression requires a demo source/JAR profile; skip-removal is an explicit negative control requiring animation regression.')
if ((demoSource && demoPackaged) || (demoMode && providers.gradleProperty('pulseTestJarBootstrap').isPresent()))
    throw new GradleException('Select exactly one bootstrap/demo source/demo JAR profile.')

def unsupported = ['pulseTestMod', 'pulseTestJar', 'pulseSmokeAuto', 'pulseSmokeWorld', 'pulseOitTest', 'pulseOitPerf', 'pulsePlayerMotionTest', 'pulseItemIdentityTest', 'pulseGeckoDemo', 'pulseMotionPhase', 'pulseOitBaseline', 'pulseSmokeReproduce', 'pulseSmokeSkipHook']
if (unsupported.any { providers.gradleProperty(it).isPresent() })
    throw new GradleException('The complete canonical regression harnesses remain stage 7.1b.2. Packaged bootstrap uses only -PpulseTestJarBootstrap; it cannot open existing demo worlds.')

if (providers.gradleProperty('pulseTestJarBootstrap').isPresent() || demoMode) {
    def packaged = providers.gradleProperty('pulseBootstrapJar').map { rootProject.file(it) }.getOrElse((demoMode ? demoJar : testmodJar).get().archiveFile.get().asFile)
    if (!demoSource && !packaged.isFile())
        throw new GradleException(demoMode ? 'Build :fabric:demoJar :neoforge:demoJar first, then start the demo in a separate Gradle invocation.' : 'Build :fabric:testmodJar :neoforge:testmodJar first, then start packaged bootstrap in a separate Gradle invocation.')
    def runId = providers.gradleProperty('pulseBootstrapRunId').getOrElse(UUID.randomUUID().toString())
    if (!(runId ==~ /[A-Za-z0-9_-]+/))
        throw new GradleException('pulseBootstrapRunId must be a simple directory name, never a path.')
    def root = layout.buildDirectory.dir("pulselib-tests/${runId}").get().asFile.toPath().toAbsolutePath().normalize()
    def prepare = [:]
    ['client', 'server'].each { kind ->
        def directory = root.resolve(kind)
        prepare[kind] = tasks.register("prepareTestmod${kind.capitalize()}") {
            doLast {
                for (def parent = directory; parent != null; parent = parent.parent)
                    if (Files.isSymbolicLink(parent))
                        throw new GradleException("Refusing symlink in disposable run path: ${parent}")
                if (Files.exists(directory))
                    throw new GradleException("Refusing every existing disposable run directory: ${directory}")
                byte[] eula = null
                if (kind == 'server') {
                    def configured = providers.gradleProperty('pulseTestEulaFile').orNull
                    if (configured == null)
                        throw new GradleException('Dedicated bootstrap requires -PpulseTestEulaFile=<your previously accepted eula.txt>; no EULA is accepted automatically.')
                    def source = rootProject.file(configured).toPath()
                    if (Files.isSymbolicLink(source) || !Files.isRegularFile(source) || !(Files.readString(source) =~ /(?m)^eula=true\s*$/))
                        throw new GradleException('pulseTestEulaFile must be a regular previously accepted eula.txt.')
                    eula = Files.readAllBytes(source)
                }
                Files.createDirectories(directory.parent)
                Files.createDirectory(directory)
                Files.writeString(directory.resolve('.pulselib-test-run'), 'PulseLib disposable test run\n', StandardOpenOption.CREATE_NEW)
                if (kind == 'server') {
                    Files.write(directory.resolve('eula.txt'), eula, StandardOpenOption.CREATE_NEW)
                    Files.writeString(directory.resolve('server.properties'), 'server-ip=127.0.0.1\nserver-port=0\nonline-mode=false\nlevel-name=pulselib-bootstrap\nlevel-type=minecraft:flat\nlevel-seed=345028449093\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\ngenerate-structures=false\ngamemode=creative\ndifficulty=peaceful\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nmax-players=1\n', StandardOpenOption.CREATE_NEW)
                    Files.createDirectory(directory.resolve('pulselib-bootstrap'))
                    Files.writeString(directory.resolve('pulselib-bootstrap/.pulselib-disposable'), 'PulseLib disposable test world\n', StandardOpenOption.CREATE_NEW)
                }
                logger.lifecycle("PULSE BOOTSTRAP PREPARED: ${directory}")
            }
        }
        tasks.matching { it.name == "prepare${kind.capitalize()}Run" || it.name == "configure${kind.capitalize()}Launch" }.configureEach {
            dependsOn prepare[kind]
        }
        tasks.matching { it.name == "run${kind.capitalize()}" }.configureEach {
            dependsOn prepare[kind]
            workingDir directory.toFile()
            doFirst {
                if (workingDir.toPath().toAbsolutePath().normalize() != directory || !Files.isRegularFile(directory.resolve('.pulselib-test-run')))
                    throw new GradleException("Unexpected bootstrap JVM working directory: ${workingDir}")
            }
            doLast {
                def result = directory.resolve(demoMode ? 'demo-results.json' : 'bootstrap-results.json').toFile()
                if (!result.isFile() || new JsonSlurper().parse(result).status != 'PASS')
                    throw new GradleException("Packaged bootstrap did not produce PASS result: ${directory}")
                logger.lifecycle("PULSE BOOTSTRAP VERIFIED: ${directory}")
            }
        }
    }
    if (project.name == 'fabric') {
        tasks.matching { it.name == 'downloadAssets' }.configureEach { dependsOn prepare['client'] }
        if (demoSource) {
            sourceSets.main.runtimeClasspath += sourceSets.demo.output
        } else {
            dependencies { runtimeOnly files(packaged) }
        }
        if (demoSource)
            loom.mods { pulselib { sourceSet sourceSets.main }; pulselibtest { sourceSet sourceSets.demo } }
        loom.runs.configureEach { run ->
            if (run.name in ['client', 'server']) {
                run.runDir project.relativePath(root.resolve(run.name).toFile())
                run.vmArg "-Dpulselib.test.runDirectory=${root.resolve(run.name)}"
                run.vmArg '-Xlog:class+load=info:file=classloading.log'
                if (demoMode)
                    run.vmArg "-Dpulselib.test.demoMode=${demoSource ? 'source' : 'jar'}"
                if (animationRegression) {
                    run.vmArg '-Dpulselib.test.animationRegression=true'
                    if (skipAnimationRemoval)
                        run.vmArg '-Dpulselib.test.skipAnimationRemoval=true'
                }
                if (lifecycleRegression) {
                    run.vmArg '-Dpulselib.test.lifecycleRegression=true'
                    if (skipDisconnectHook)
                        run.vmArg '-Dpulselib.test.skipDisconnectHook=true'
                }
                if (run.name == 'client')
                    run.programArgs '--width', '960', '--height', '640'
            }
        }
    } else {
        if (demoSource) {
            sourceSets.main.runtimeClasspath += sourceSets.demo.output
        } else {
            dependencies { runtimeOnly files(packaged) }
        }
        if (demoSource)
            neoForge.mods { pulselibtest { sourceSet sourceSets.demo } }
        neoForge.runs.configureEach { run ->
            if (run.name in ['client', 'server']) {
                run.gameDirectory = root.resolve(run.name).toFile()
                run.systemProperty 'pulselib.test.runDirectory', root.resolve(run.name).toString()
                run.jvmArgument '-Xlog:class+load=info:file=classloading.log'
                if (demoMode)
                    run.systemProperty 'pulselib.test.demoMode', demoSource ? 'source' : 'jar'
                if (animationRegression) {
                    run.systemProperty 'pulselib.test.animationRegression', 'true'
                    if (skipAnimationRemoval)
                        run.systemProperty 'pulselib.test.skipAnimationRemoval', 'true'
                }
                if (lifecycleRegression) {
                    run.systemProperty 'pulselib.test.lifecycleRegression', 'true'
                    if (skipDisconnectHook)
                        run.systemProperty 'pulselib.test.skipDisconnectHook', 'true'
                }
                if (run.name == 'client')
                    run.programArguments.addAll '--width', '960', '--height', '640'
            }
        }
    }
}
