plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    gradlePluginPortal()
}

dependencies {
    implementation 'net.neoforged:moddev-gradle:2.0.141'
    implementation 'net.fabricmc:fabric-loom:1.15.5'
    implementation 'com.modrinth.minotaur:Minotaur:2.10.0'
    implementation 'net.darkhax.curseforgegradle:CurseForgeGradle:1.2.30'
}

gradlePlugin {
    plugins {
        multiloaderPublishing {
            id = 'multiloader-publishing'
            implementationClass = 'MultiloaderPublishingPlugin'
        }
    }
}
