plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        include implementation(it)
    }
}

loom {
    accessWidenerPath = file("src/main/resources/pulselib.accesswidener")
    runs {
        client { client(); configName = 'Fabric Client (PulseLib)'; ideConfigGenerated true; runDir 'runs/client' }
        server { server(); configName = 'Fabric Server (PulseLib)'; ideConfigGenerated true; runDir 'runs/server' }
    }
}

// Fabric renderer hook parity remains in stage 6.2.
// Keep the incomplete Fabric variant out of the existing release workflow.
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}

// Disposable dedicated-server bootstrap witnesses; never included in release JARs.
if (providers.gradleProperty('pulseFabricBootstrapProbe').isPresent()) {
    sourceSets {
        stage61Smoke {
            java.srcDir rootProject.file('tests/stage61/fabric/java')
            resources.srcDir rootProject.file('tests/stage61/fabric/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            pulselib { sourceSet sourceSets.main }
            pulselib_stage61 { sourceSet sourceSets.stage61Smoke }
        }
        runs {
            server {
                source sourceSets.stage61Smoke
                runDir "build/${providers.gradleProperty('pulseVerificationDir').getOrElse('stage61a-runs')}/server"
                vmArg '-Xlog:class+load=info:file=classloading.log'
            }
        }
    }
    tasks.named('runServer') { standardInput = System.in }
}

// Client lifecycle probe uses its own mod roots and disposable directories.
if (providers.gradleProperty('pulseFabricClientProbe').isPresent() || providers.gradleProperty('pulseFabricAtlasProbe').isPresent() || providers.gradleProperty('pulseFabricWorldProbe').isPresent() || providers.gradleProperty('pulseFabricStagesProbe').isPresent() || providers.gradleProperty('pulseFabricTransparencyProbe').isPresent() || providers.gradleProperty('pulseFabricGuiProbe').isPresent()) {
    sourceSets {
        stage61Client {
            java.srcDir rootProject.file('tests/stage61client/fabric/java')
            resources.srcDir rootProject.file('tests/stage61client/fabric/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            pulselib { sourceSet sourceSets.main }
            pulselib_stage61client { sourceSet sourceSets.stage61Client }
        }
        runs {
            client {
                source sourceSets.stage61Client
                if (providers.gradleProperty('pulseFabricGuiProbe').isPresent()) {
                    vmArg '-Dpulselib.fabricGuiProbe=true'
                    programArgs '--width', '960', '--height', '640'
                }
                if (providers.gradleProperty('pulseFabricTransparencyProbe').isPresent())
                    vmArg '-Dpulselib.fabricTransparencyProbe=true'
                if (providers.gradleProperty('pulseFabricStagesProbe').isPresent() && !providers.gradleProperty('pulseFabricTransparencyProbe').isPresent())
                    vmArg '-Dpulselib.fabricStagesProbe=true'
                if (providers.gradleProperty('pulseFabricWorldProbe').isPresent() || providers.gradleProperty('pulseFabricStagesProbe').isPresent() || providers.gradleProperty('pulseFabricTransparencyProbe').isPresent()) {
                    if (!(providers.gradleProperty('pulseFabricStagesProbe').isPresent() || providers.gradleProperty('pulseFabricTransparencyProbe').isPresent()))
                        vmArg '-Dpulselib.fabricWorldProbe=true'
                    programArgs '--quickPlayMultiplayer', '127.0.0.1:25580', '--width', '960', '--height', '640'
                }
                if (providers.gradleProperty('pulseFabricAtlasProbe').isPresent())
                    vmArg '-Dpulselib.fabricAtlasProbe=true'
                runDir "build/${providers.gradleProperty('pulseVerificationDir').getOrElse('stage61b1-runs')}/client"
                vmArg '-Xlog:class+load=info:file=classloading.log'
            }
            server {
                runDir "build/${providers.gradleProperty('pulseVerificationDir').getOrElse('stage61b1-runs')}/server"
                vmArg '-Xlog:class+load=info:file=classloading.log'
            }
        }
    }
    tasks.named('runServer') { standardInput = System.in }
}

// Server-only isolation for the disposable world lifecycle probe.
if (providers.gradleProperty('pulseFabricWorldProbe').isPresent() || providers.gradleProperty('pulseFabricStagesProbe').isPresent() || providers.gradleProperty('pulseFabricTransparencyProbe').isPresent()) {
    sourceSets {
        stage61WorldServer {
            java.srcDir rootProject.file('tests/stage61worldserver/fabric/java')
            resources.srcDir rootProject.file('tests/stage61worldserver/fabric/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods { pulselib_stage61worldserver { sourceSet sourceSets.stage61WorldServer } }
        runs {
            server {
                source sourceSets.stage61WorldServer
                if (providers.gradleProperty('pulseFabricTransparencyProbe').isPresent())
                    vmArg '-Dpulselib.fabricTransparencyProbe=true'
            }
        }
    }
}
