if (providers.gradleProperty('pulseArmorProviderProbe').isPresent()) {
    sourceSets {
        stage62Armor {
            java.srcDirs rootProject.file('tests/stage62armor/common/java'), rootProject.file('tests/stage62armor/fabric/java')
            resources.srcDirs rootProject.file('tests/stage62armor/common/resources'), rootProject.file('tests/stage62armor/fabric/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
