plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'multiloader-publishing'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        include implementation(it)
    }
}

loom {
    accessWidenerPath = file('src/main/resources/pulselib.accesswidener')
    runs {
        client { client(); configName = 'Fabric Client (PulseLib)'; ideConfigGenerated true; runDir 'runs/client' }
        server { server(); configName = 'Fabric Server (PulseLib)'; ideConfigGenerated true; runDir 'runs/server' }
    }
}

apply plugin: 'multiloader-testmod'
