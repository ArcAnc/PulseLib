if (providers.gradleProperty('pulseDeformationParityProbe').isPresent()) {
    sourceSets {
        stage62Deformation {
            java.srcDirs rootProject.file('tests/stage62deformation/common/java'), rootProject.file('tests/stage62deformation/fabric/java')
            resources.srcDirs rootProject.file('tests/stage62deformation/common/resources'), rootProject.file('tests/stage62deformation/fabric/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
