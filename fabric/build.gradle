plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'multiloader-publishing'
}

apply from: rootProject.file('testmod/source-set.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    ['de.javagl:jgltf-model:2.0.3', 'de.javagl:jgltf-impl-v1:2.0.3', 'de.javagl:jgltf-impl-v2:2.0.3',
     'com.fasterxml.jackson.core:jackson-databind:2.13.2.1',
     'com.fasterxml.jackson.core:jackson-annotations:2.13.2', 'com.fasterxml.jackson.core:jackson-core:2.13.2'].each {
        include implementation(it)
    }
}

loom {
    accessWidenerPath = file("src/main/resources/pulselib.accesswidener")
    mods {
        pulselib { sourceSet sourceSets.main }
        pulselib_test { sourceSet sourceSets.testmod }
    }
    runs {
        client {
            displayName.set("Fabric Client (PulseLib ${minecraft_version})")
            generateRunConfig.set(true)
            runDirectory.set(project.layout.projectDirectory.dir('runs/client'))
        }
        testClient {
            client()
            sourceSet.set('testmod')
            displayName.set("Fabric Test Client (PulseLib ${minecraft_version})")
            runDirectory.set(project.layout.projectDirectory.dir('runs/testmod'))
        }
        server {
            displayName.set("Fabric Server (PulseLib ${minecraft_version})")
            generateRunConfig.set(true)
            runDirectory.set(project.layout.projectDirectory.dir('runs/server'))
        }
    }
}
