sourceSets {
	testmod {
		def fixture = rootProject.file('testmod')
		java.srcDirs = [new File(fixture, 'common/src/main/java'), new File(fixture, "${project.name}/src/main/java")]
		resources.srcDirs = [new File(fixture, 'common/src/main/resources'), new File(fixture, "${project.name}/src/main/resources")]
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

tasks.named('check') {
	dependsOn tasks.named('testmodClasses')
}
