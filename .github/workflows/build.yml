name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test both loaders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload loader JARs
        uses: actions/upload-artifact@v4
        with:
          name: pulselib-1.21.1
          if-no-files-found: error
          path: |
            neoforge/build/libs/pulselib-1.21.1-neoforge-*.jar
            fabric/build/libs/pulselib-1.21.1-fabric-*.jar
      - name: Upload JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          if-no-files-found: ignore
          path: |
            common/build/reports/tests/
            common/build/test-results/
            neoforge/build/reports/tests/
            neoforge/build/test-results/
            fabric/build/reports/tests/
            fabric/build/test-results/
