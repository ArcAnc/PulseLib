name: Deploy documentation

on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
      - 'website/**'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch versioned documentation sources
        run: |
          git fetch origin \
            refs/heads/1.21.1-multiloader:refs/remotes/origin/1.21.1-multiloader \
            refs/heads/26.1.2-multiloader:refs/remotes/origin/26.1.2-multiloader \
            refs/heads/26.2-multiloader:refs/remotes/origin/26.2-multiloader

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
